<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Press ID Verification — JourKnows PH</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#000E4B; --blue:#00198D; --sky:#5B8CFF; --ice:#DCEBFF;
  --green:#30D158; --amber:#FF9F0A; --red:#FF453A;
  --glass:rgba(255,255,255,.12); --glass-line:rgba(255,255,255,.18);
  --label:#fff; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.34);
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,system-ui,Arial,sans-serif;
  --c:var(--green);
  --ease-spring:cubic-bezier(.3,1.35,.5,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#000;color:var(--label);font-family:var(--sf);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{min-height:100dvh}
button,input{font:inherit;color:inherit}

/* ---------- iOS 16-style wallpaper ---------- */
.wallpaper{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#00126b 0%,#000E4B 55%,#00061f 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9;will-change:transform}
.b1{width:80vmax;height:80vmax;left:-30vmax;top:-25vmax;background:radial-gradient(circle,#2F5BFF 0%,rgba(47,91,255,0) 68%);animation:drift1 22s ease-in-out infinite alternate}
.b2{width:70vmax;height:70vmax;right:-30vmax;top:10vmax;background:radial-gradient(circle,#5B8CFF 0%,rgba(91,140,255,0) 65%);opacity:.55;animation:drift2 26s ease-in-out infinite alternate}
.b3{width:75vmax;height:75vmax;left:-20vmax;bottom:-40vmax;background:radial-gradient(circle,#00C2FF 0%,rgba(0,194,255,0) 62%);opacity:.38;animation:drift3 30s ease-in-out infinite alternate}
.b4{width:50vmax;height:50vmax;right:-15vmax;bottom:-10vmax;background:radial-gradient(circle,#7A5CFF 0%,rgba(122,92,255,0) 62%);opacity:.3;animation:drift1 34s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(12vmax,10vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-14vmax,8vmax) scale(.92)}}
@keyframes drift3{to{transform:translate(10vmax,-12vmax) scale(1.15)}}
.dim{position:absolute;inset:0;background:#000;opacity:.94;transition:opacity 1.2s var(--ease-out)}
.revealed .dim{opacity:.0}

/* ---------- Dynamic Island ---------- */
.island{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 11px);left:50%;transform:translateX(-50%);
  height:37px;width:0;background:#000;border-radius:22px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  transition:width .6s var(--ease-spring),height .6s var(--ease-spring),opacity .3s;opacity:0}
.island.on{width:126px;opacity:1}
.island.scan{width:196px}
.island.done{width:206px}
.isl-in{display:flex;align-items:center;gap:9px;padding:0 14px;opacity:0;white-space:nowrap;transition:opacity .25s .15s}
.island.scan .isl-in,.island.done .isl-in{opacity:1}
.isl-ic{width:18px;height:18px;flex:none;position:relative}
.isl-ic svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke:#fff}
.isl-ic .i-face{opacity:1;transition:opacity .2s}
.isl-ic .i-ok{opacity:0;stroke:var(--c);transition:opacity .2s}
.island.done .i-face{opacity:0}
.island.done .i-ok{opacity:1}
.isl-t{font-size:13px;font-weight:600;letter-spacing:-.1px}

/* ---------- Face ID stage ---------- */
.fid{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:24px;
  transition:opacity .8s var(--ease-out),transform 1s var(--ease-out),filter .8s var(--ease-out)}
.fid.out{opacity:0;transform:scale(1.35);filter:blur(24px);pointer-events:none}
.glyph-wrap{position:relative;width:min(46vw,190px);aspect-ratio:1}
.glyph{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 14px rgba(255,255,255,.28))}
.glyph path,.glyph circle{fill:none;stroke:#fff;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
.brackets{opacity:0;transform:scale(1.4);transform-origin:60px 60px;transition:opacity .6s ease,transform .9s var(--ease-out)}
.fid.in .brackets{opacity:1;transform:none}
.face{transform-origin:60px 60px;transition:opacity .35s,transform .5s var(--ease-out)}
.feat path{stroke-dasharray:1;stroke-dashoffset:1}
.fid.draw .feat path{animation:draw .75s var(--ease-out) forwards}
.fid.draw .feat path:nth-child(2){animation-delay:.12s}
.fid.draw .feat path:nth-child(3){animation-delay:.24s}
.fid.draw .feat path:nth-child(4){animation-delay:.4s}
@keyframes draw{to{stroke-dashoffset:0}}
.fid.scan .brackets{animation:breathe 1.15s ease-in-out infinite}
.fid.scan .face{animation:facePulse 1.15s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(.9)}}
@keyframes facePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
/* scan beam */
.beam{position:absolute;left:8%;right:8%;top:8%;height:22%;border-radius:50%;opacity:0;
  background:linear-gradient(180deg,rgba(150,190,255,0),rgba(150,190,255,.38),rgba(150,190,255,0));filter:blur(6px);mix-blend-mode:screen}
.fid.scan .beam{animation:beam 1.5s ease-in-out infinite}
@keyframes beam{0%{opacity:0;transform:translateY(0)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(300%)}}

/* outcome */
.mark{opacity:0}
.ring{stroke-dasharray:1;stroke-dashoffset:1;transform:rotate(-90deg);transform-origin:60px 60px}
.mark path{stroke-dasharray:1;stroke-dashoffset:1}
.fid.ok .brackets,.fid.warn .brackets,.fid.bad .brackets{opacity:0;transform:scale(.7);animation:none}
.fid.ok .face,.fid.warn .face,.fid.bad .face{opacity:0;transform:scale(.6);animation:none}
.fid.ok .mark,.fid.warn .mark,.fid.bad .mark{opacity:1}
.fid.ok .mark *,.fid.warn .mark *,.fid.bad .mark *{stroke:var(--c)}
.fid.ok{--c:var(--green)} .fid.warn{--c:var(--amber)} .fid.bad{--c:var(--red)}
.fid.ok .ring,.fid.warn .ring,.fid.bad .ring{animation:draw .7s .1s var(--ease-out) forwards}
.mk{display:none}
.fid.ok .mk-check,.fid.warn .mk-bang,.fid.bad .mk-x{display:block}
.fid.ok .mk-check,.fid.warn .mk-bang,.fid.bad .mk-x{animation:draw .5s .55s var(--ease-out) forwards}
.fid.bad .mk-x:nth-of-type(2){animation-delay:.7s}
.burst{position:absolute;inset:6%;border-radius:50%;border:2px solid var(--c);opacity:0;pointer-events:none}
.fid.ok .burst,.fid.warn .burst,.fid.bad .burst{animation:burst 1.1s .35s var(--ease-out) forwards}
.fid.ok .glyph-wrap,.fid.warn .glyph-wrap{animation:pop .7s .3s var(--ease-spring)}
@keyframes burst{0%{opacity:.9;transform:scale(.9)}100%{opacity:0;transform:scale(2.4)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.fid.shake .glyph-wrap{animation:shake .65s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-14px) rotate(-5deg)}35%{transform:translateX(12px) rotate(4deg)}55%{transform:translateX(-9px) rotate(-3deg)}75%{transform:translateX(6px) rotate(2deg)}}

.fid-text{text-align:center;min-height:74px;transition:opacity .3s,transform .3s}
.fid-text.swap{opacity:0;transform:translateY(6px)}
.fid-title{font-size:22px;font-weight:600;letter-spacing:-.4px}
.fid-sub{margin-top:6px;font-size:14px;color:var(--label2);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.fid-brand{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);text-align:center;font-family:Poppins,var(--sf);font-weight:800;font-size:11px;letter-spacing:3px;color:var(--label3)}

/* ---------- Entry (manual code) ---------- */
.entry{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:24px}
.entry.show{display:flex}
.sheet{width:min(100%,380px);padding:30px 24px 24px;border-radius:32px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.sheet h2{margin:14px 0 6px;font-size:24px;font-weight:700;letter-spacing:-.5px}
.sheet p{margin:0 0 20px;font-size:14px;line-height:1.45;color:var(--label2)}
.code-in{width:100%;padding:16px;border-radius:14px;border:1px solid var(--glass-line);background:rgba(0,0,0,.28);text-align:center;font-size:22px;font-weight:600;letter-spacing:5px;text-transform:uppercase;outline:none}
.code-in:focus{border-color:rgba(255,255,255,.5)}
.code-in::placeholder{letter-spacing:5px;color:var(--label3)}
.btn-ios{display:block;width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;background:#0A84FF;color:#fff;font-size:17px;font-weight:600;cursor:pointer;transition:transform .15s,opacity .15s}
.btn-ios:active{transform:scale(.97);opacity:.85}
.btn-plain{background:none;border:0;color:#64B5FF;font-size:15px;padding:14px 8px 0;cursor:pointer}

/* ---------- Result ---------- */
.result{position:relative;z-index:10;display:none;min-height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 72px) 18px calc(env(safe-area-inset-bottom,0px) + 40px)}
.result.show{display:block}
.wrap{max-width:440px;margin:0 auto}
.rise{opacity:0;transform:translateY(34px) scale(.98);filter:blur(10px)}
.result.go .rise{animation:rise .9s var(--ease-out) forwards;animation-delay:calc(var(--i,0) * 110ms + 150ms)}
@keyframes rise{to{opacity:1;transform:none;filter:none}}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding:0 4px}
.logo{height:26px;width:auto;display:block}
.wm{font-family:Poppins,var(--sf);font-weight:900;font-size:15px;letter-spacing:1.5px}
.live{font-size:12px;color:var(--label2);display:flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 0 var(--c);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(48,209,88,.6)}70%{box-shadow:0 0 0 8px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}

/* the pass */
.stage3d{perspective:900px}
.pass{position:relative;overflow:hidden;border-radius:30px;padding:22px 22px 24px;text-align:center;
  background:linear-gradient(165deg,#0a2bb5 0%,var(--blue) 35%,var(--navy) 100%);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:calc(var(--px,0)*-14px) calc(30px + var(--py,0)*-10px) 70px rgba(0,8,50,.6),inset 0 1px 0 rgba(255,255,255,.3);
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;
  will-change:transform;touch-action:pan-y;-webkit-backface-visibility:hidden;backface-visibility:hidden}
/* depth: layers drift at different rates against the tilt (--px/--py are -1..1, set by the tilt engine) */
.pass .pass-top{transform:translate3d(calc(var(--px,0)*4px),calc(var(--py,0)*3px),0)}
.pass .avatar{transform:translate3d(calc(var(--px,0)*9px),calc(var(--py,0)*7px),0)}
.pass .p-name,.pass .p-role,.pass .p-desk{transform:translate3d(calc(var(--px,0)*5px),calc(var(--py,0)*4px),0)}
.pass .p-press{transform:translate3d(calc(var(--px,0)*-8px),calc(var(--py,0)*-6px),0)}
.pass:before{content:"";position:absolute;left:-25%;right:-25%;top:16%;height:46%;border-radius:50%;background:rgba(220,235,255,.12)}
.pass:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.28),transparent 45%);pointer-events:none;mix-blend-mode:soft-light}
.pass>*{position:relative;z-index:1}
.pass-top{display:flex;justify-content:space-between;align-items:center}
.pill{font-size:10px;font-weight:700;letter-spacing:1.6px;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2)}
.avatar{position:relative;width:136px;height:136px;margin:26px auto 18px;border-radius:50%;border:5px solid #fff;overflow:hidden;background:linear-gradient(135deg,#5B8CFF,#00198D);box-shadow:0 14px 34px rgba(0,8,50,.5);display:grid;place-items:center;font-family:Poppins,var(--sf);font-weight:800;font-size:44px;transform-style:preserve-3d}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-base{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- holographic artifact ----------
   Idle: only the JPEG in the circular frame shows. On interaction the stage below
   (sits above the avatar, below all ID text) grows a cutout of the person out of the
   circle. Everything is driven by vars set on #pass by holoTick():
   --hs size/depth, --ho opacity, --hb photo dim, --hm motion energy (scanlines). */
/* whole circular frame (ring, photo, shadow) fades out while interacting, fades back in when idle */
.pass.has-holo .avatar{opacity:calc(1 - var(--hb,0));will-change:opacity}
.pass .pass-top,.pass .p-name,.pass .p-role,.pass .p-desk,.pass .p-press,.pass .p-foot{z-index:2;position:relative;text-shadow:0 1px 12px rgba(0,8,50,.32)}
.pass .holo-stage{position:absolute;inset:0;z-index:1;pointer-events:none;visibility:hidden;border-radius:29px;overflow:hidden;-webkit-clip-path:inset(0 round 29px);clip-path:inset(0 round 29px)}   /* locks the hologram + flying chips inside the card's rounded corners (overflow alone leaks on Safari/iOS with 3D children) */
.pass.holo-on .holo-stage{visibility:visible}
#hFx{position:absolute;inset:0;width:100%;height:100%;transform:translateZ(0);mix-blend-mode:screen}
.holo-stage:before{content:"";position:absolute;inset:7%;z-index:0;border:1px solid rgba(225,238,255,.14);border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.035),inset 0 0 55px rgba(180,205,255,.045);opacity:var(--ho,0);pointer-events:none}
.holo-stage:after{content:"ARCHIVAL PRESS ARTIFACT";position:absolute;right:9%;bottom:8%;z-index:4;font-size:7px;letter-spacing:2px;color:rgba(225,238,255,.24);opacity:var(--ho,0);transform:rotate(-90deg);transform-origin:right bottom;pointer-events:none}
.h-box{position:absolute;opacity:var(--ho,0);will-change:transform,opacity;transform-style:preserve-3d;
  transform:translate3d(calc(var(--px,0)*-14px),calc(var(--py,0)*-10px),0) scale(calc(1.12 + var(--py,0)*.035))}
.h-box>*{position:absolute;inset:0;width:100%;height:100%;display:block}
.hm{-webkit-mask-image:var(--holo-mask);mask-image:var(--holo-mask);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.h-echo{opacity:.3;mix-blend-mode:screen;filter:brightness(1.35) saturate(.9) blur(3px);transform:translate3d(calc(var(--px,0)*-10px),calc(var(--py,0)*-7px),0) scale(1.03)}
.h-echo.b{opacity:.2;filter:brightness(1.3) saturate(.9) blur(1px);transform:translate3d(calc(var(--px,0)*8px),calc(var(--py,0)*6px),0) scale(.98)}
.h-fig{opacity:.5;animation:hFlick 5.5s linear infinite;
  filter:brightness(1.22) contrast(1.05) saturate(1.05) drop-shadow(calc(var(--px,0)*-7px) 0 7px rgba(200,222,255,.5))}
.h-tint{mix-blend-mode:screen;background:linear-gradient(180deg,rgba(235,244,255,.14),rgba(140,175,255,.08) 60%,rgba(70,110,255,.06))}
.h-light{mix-blend-mode:screen;background:radial-gradient(circle at var(--mx,50%) calc(var(--my,30%) * .8),rgba(255,255,255,.5),transparent 55%)}
.h-scan{mix-blend-mode:screen;opacity:calc(.25 + .75*var(--hm,0));animation:hScan 3.2s linear infinite;
  background:repeating-linear-gradient(176deg,rgba(225,238,255,.22) 0 1px,transparent 1px 3px),repeating-linear-gradient(176deg,rgba(255,255,255,.34) 0 1px,transparent 1px 9px)}
.h-sweep{mix-blend-mode:screen;opacity:calc(.3 + .7*var(--hm,0));background-size:100% 260%;animation:hSweep 2.6s ease-in-out infinite;
  background-image:linear-gradient(176deg,transparent 42%,rgba(240,247,255,.5) 50%,transparent 58%)}
.holo-glass{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:29px;-webkit-clip-path:inset(0 round 29px);clip-path:inset(0 round 29px);mix-blend-mode:screen;opacity:calc(var(--ho,0)*.5);
  background:linear-gradient(115deg,transparent calc(28% + var(--px,0)*16%),rgba(255,255,255,.12) calc(38% + var(--px,0)*16%),transparent calc(48% + var(--px,0)*16%))}
@keyframes hScan{to{background-position:0 54px}}
@keyframes hSweep{0%{background-position:0 100%}100%{background-position:0 0}}
@keyframes hFlick{0%,46%,100%{opacity:.74}48%{opacity:.62}50%{opacity:.78}78%{opacity:.68}}
@media (prefers-reduced-motion:reduce){.h-fig,.h-scan,.h-sweep{animation:none}}
.p-name{margin:0;font-family:Poppins,var(--sf);font-weight:900;font-size:clamp(24px,8vw,32px);line-height:1.05;letter-spacing:-.6px;text-transform:uppercase}
.p-role{margin-top:9px;font-size:13px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--ice)}
.p-desk{margin-top:5px;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.6)}
.p-press{margin-top:30px;font-family:Poppins,var(--sf);font-weight:900;font-size:58px;letter-spacing:10px;margin-right:-10px;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.55)}
.p-foot{margin-top:8px;font-size:9.5px;font-weight:700;letter-spacing:2.6px;color:rgba(255,255,255,.62)}

.tilt-chip{display:block;margin:14px auto 0;padding:9px 16px;border-radius:99px;border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);font-size:13px;font-weight:600;color:#fff;cursor:pointer;transition:transform .15s,background .15s}
.tilt-chip:active{transform:scale(.96);background:rgba(255,255,255,.2)}

/* glass primitives */
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:22px;backdrop-filter:blur(34px) saturate(180%);-webkit-backdrop-filter:blur(34px) saturate(180%)}
.banner{display:flex;align-items:center;gap:14px;margin-top:16px;padding:16px 18px}
.b-ic{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent)}
.b-ic svg{width:20px;height:20px;fill:none;stroke:var(--c);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.b-t{font-size:17px;font-weight:600;letter-spacing:-.3px}
.b-s{margin-top:2px;font-size:13px;line-height:1.35;color:var(--label2)}
.g-title{margin:26px 0 8px;padding:0 16px;font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.4px}
.group{overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;position:relative;width:100%;text-align:left;background:none;border:0}
.row+.row:before{content:"";position:absolute;top:0;left:18px;right:0;height:1px;background:rgba(255,255,255,.12)}
.row .k{font-size:16px;color:var(--label);white-space:nowrap}
.row .v{font-size:16px;color:var(--label2);text-align:right;word-break:break-word;font-variant-numeric:tabular-nums}
.row.copy{cursor:pointer;transition:background .15s}
.row.copy:active{background:rgba(255,255,255,.14)}
.row .v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;letter-spacing:.6px}
.note{margin:12px 16px 0;font-size:12.5px;line-height:1.5;color:var(--label3)}
.sample{margin-bottom:12px;padding:10px 14px;text-align:center;font-size:12.5px;font-weight:600;color:#FFD60A;background:rgba(255,214,10,.14);border:1px solid rgba(255,214,10,.3);border-radius:14px}
.actions{margin-top:22px;display:grid;gap:10px}
.act{padding:15px;border-radius:16px;border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);font-size:16px;font-weight:600;color:#64B5FF;cursor:pointer;transition:transform .15s,background .15s}
.act:active{transform:scale(.97);background:rgba(255,255,255,.2)}
.foot{margin-top:30px;text-align:center;font-size:11.5px;line-height:1.55;color:var(--label3)}
.foot b{display:block;font-family:Poppins,var(--sf);font-weight:800;font-size:11px;letter-spacing:3px;color:var(--label2);margin-bottom:8px}

/* failure */
.fail-card{margin-top:6px;padding:34px 24px 26px;text-align:center}
.fail-card .b-ic{width:64px;height:64px;margin:0 auto 18px}
.fail-card .b-ic svg{width:32px;height:32px}

<script>
const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const F = reduced ? .35 : 1;
const sleep = ms => new Promise(r => setTimeout(r, ms * F));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };

const SAMPLE = {
  holderName: 'Paolo Emmanuel Blanco', position: 'News Writer', department: 'News',
  pressId: 'JK-PRESS-000001', verifyCode: 'SAMPLE0000',
  validFrom: '2026-08-01', validUntil: '2027-07-31', issuedAt: '2026-08-01T09:00:00Z', _sample: true
};

let currentCode = '';
let runToken = 0;

/* ---------- code from URL: /CODE, ?code=CODE or #CODE ---------- */
function codeFromURL() {
  const q = new URLSearchParams(location.search);
  if (q.has('sample') || q.has('demo')) return { sample: true };
  let c = q.get('code') || '';
  if (!c) {
    const seg = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
    if (seg && !/\.(html?|php)$/i.test(seg) && seg.toLowerCase() !== 'verify') c = seg;
  }
  if (!c && location.hash.length > 1) c = decodeURIComponent(location.hash.slice(1));
  return { code: c.trim().toUpperCase() };
}

/* ---------- registry lookup (live from the Google Sheets API, with
   the static data.json export kept as a fallback) ---------- */
const GOOGLE_SHEETS_API = "https://script.google.com/macros/s/AKfycbxyZlrEQOY7wOavz4U0wO-EYo0L95taAGBRB6DbDmETZiQCaPnQSjHvrM2NFg5588rUvg/exec";

async function loadRegistry() {
  for (const url of ['/data.json', 'data.json']) {
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) continue;
      const j = await r.json();
      return Array.isArray(j) ? j : (j.records || j.issued || []);
    } catch (e) {}
  }
  return null;
}
async function findRecord(code) {
  if (code === '__SAMPLE__') return { ...SAMPLE };
  const c = code.toUpperCase();

  if (GOOGLE_SHEETS_API) {
    try {
      const r = await fetch(GOOGLE_SHEETS_API + '?code=' + encodeURIComponent(c), { cache: 'no-store' });
      if (r.ok) {
        const rec = await r.json();
        if (rec) return rec;
      }
    } catch (e) {}
  }

  const list = await loadRegistry();
  if (!list) return null;
  return list.find(r => String(r.verifyCode || '').toUpperCase() === c) || null;
}

/* ---------- automatic person cutout + holographic artifact ----------
   In-browser only: MediaPipe Selfie Segmentation (CDN, no API key) cuts the person out once
   per photo. If it (or a CORS-blocked photo host) fails, the hologram falls back to the
   photo with a soft bust-shaped mask, so it never breaks. */
const CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/';
const cutoutCache = new Map();
let segmenterPromise = null;
const sm = (a, b, x) => { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); };
const loadImg = (u, cors) => new Promise((ok, no) => { const i = new Image(); if (cors) i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = no; i.src = u; });
function loadSegmenter() {
  return segmenterPromise || (segmenterPromise = new Promise((res, rej) => {
    const mk = () => { try { const g = new SelfieSegmentation({ locateFile: f => CDN + f }); g.setOptions({ modelSelection: 0 }); res(g); } catch (e) { rej(e); } };
    if (window.SelfieSegmentation) return mk();
    const t = document.createElement('script'); t.src = CDN + 'selfie_segmentation.js'; t.onload = mk; t.onerror = rej; document.head.appendChild(t);
  }));
}
/* alpha canvas -> cropped PNG + normalized silhouette edge points (spawn sites for fragments) */
function silhouette(c) {
  const gw = 48, gh = Math.max(8, Math.round(gw * c.height / c.width)), g = document.createElement('canvas');
  g.width = gw; g.height = gh; const gx = g.getContext('2d'); gx.drawImage(c, 0, 0, gw, gh);
  const d = gx.getImageData(0, 0, gw, gh).data;
  const A = (x, y) => x >= 0 && y >= 0 && x < gw && y < gh && d[(y * gw + x) * 4 + 3] > 110;
  let x0 = gw, x1 = -1, y0 = gh, y1 = -1;
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) if (A(x, y)) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  if (x1 - x0 < 6 || y1 - y0 < 6) return null;
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1, o = document.createElement('canvas');
  o.width = Math.round(bw / gw * c.width); o.height = Math.round(bh / gh * c.height);
  o.getContext('2d').drawImage(c, x0 / gw * c.width, y0 / gh * c.height, o.width, o.height, 0, 0, o.width, o.height);
  const pts = [];
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++)
    if (A(x, y) && !(A(x - 1, y) && A(x + 1, y) && A(x, y - 1) && A(x, y + 1))) pts.push([(x + .5 - x0) / bw, (y + .5 - y0) / bh]);
  return { url: o.toDataURL('image/png'), ar: o.width / o.height, pts };
}
function makeCut(url, seg) {
  if (cutoutCache.has(url + seg)) return cutoutCache.get(url + seg);
  const p = (async () => {
    try {
      const img = await loadImg(url, true), k = Math.min(1, 800 / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
      if (seg) {
        const sg = await loadSegmenter();
        const m = await new Promise((ok, no) => { sg.onResults(r => ok(r.segmentationMask)); sg.send({ image: img }).catch(no); });
        x.filter = 'blur(1.2px)'; x.drawImage(m, 0, 0, w, h); x.filter = 'none'; x.globalCompositeOperation = 'source-in';
      }
      x.drawImage(img, 0, 0, w, h);
      return silhouette(c);
    } catch (e) { return null; }
  })();
  cutoutCache.set(url + seg, p); return p;
}
const HOLO_HTML = '<div class="holo-stage" aria-hidden="true"><div class="h-box" id="hBox"><img class="h-echo hm" alt=""><img class="h-echo b hm" alt=""><img class="h-fig hm" alt=""><div class="h-tint hm"></div><div class="h-light hm"></div><div class="h-scan hm"></div><div class="h-sweep hm"></div></div><canvas id="hFx"></canvas></div>';
const HOLO = { L: 0, e: 0, m: 0, raf: 0, last: 0, fr: [], pts: [], ar: 1, W: 0, H: 0, pw: 0, ph: 0, bl: 0, bt: 0, ox: 0, oy: 0, pcx: 0, pcy: 0, vx: 0, vy: 0, acc: 0, cx: null };
const ellPts = () => { const a = []; for (let i = 0; i < 90; i++) { const t = i / 90 * 6.283; a.push([.5 + .3 * Math.cos(t), .38 + .36 * Math.sin(t)]); if (i % 3 == 0) a.push([.5 + .5 * Math.cos(t), 1.02 + .3 * Math.sin(t) > 1 ? .9 + .1 * Math.abs(Math.sin(t)) : 1]); } return a; };

function holoLayout() {
  const H = HOLO, p = $('pass'), box = $('hBox'), cv = $('hFx'), av = p && p.querySelector('.avatar');
  if (!p || !box || !cv || !av || !p.clientWidth) return;
  const pw = p.clientWidth, ph = p.clientHeight;
  let h = ph * 1.02, w = h * H.ar; if (w > pw * 1.08) { w = pw * 1.08; h = w / H.ar; }
  H.pw = pw; H.ph = ph; H.W = w; H.H = h; H.bl = (pw - w) / 2; H.bt = ph - h - ph * .015;
  H.ox = av.offsetLeft + av.offsetWidth / 2 - H.bl; H.oy = av.offsetTop + av.offsetHeight / 2 - H.bt;   // figure grows out of the circle
  Object.assign(box.style, { left: H.bl + 'px', top: H.bt + 'px', width: w + 'px', height: h + 'px' });
  box.style.setProperty('--ox', H.ox + 'px'); box.style.setProperty('--oy', H.oy + 'px');
  const d = H.dpr = Math.min(2, devicePixelRatio || 1); cv.width = pw * d; cv.height = ph * d;
  H.cx = cv.getContext('2d'); H.cx.setTransform(d, 0, 0, d, 0, 0);
}
function holoSet(url, r) {
  const p = $('pass'), box = $('hBox'), fig = box && box.querySelector('.h-fig'); if (!fig) return;
  p.style.setProperty('--holo-mask', r ? `url("${url}")` : 'radial-gradient(ellipse 46% 56% at 50% 46%,#000 52%,transparent 100%)');
  HOLO.pts = r ? r.pts : ellPts(); HOLO.tex = fig;
  fig.onload = () => { HOLO.ar = (r ? r.ar : fig.naturalWidth / fig.naturalHeight) || 1; holoLayout(); };
  box.querySelectorAll('img').forEach(i => i.src = url);
}
function holoInit(src, isCut) {
  const p = $('pass'); if (!p || !$('hBox') || !src) return;
  Object.assign(HOLO, { L: 0, e: 0, m: 0, pr: [], pw: 0 });
  holoSet(src, null);                                   // fallback until (or unless) a real cutout exists
  makeCut(src, !isCut).then(r => { if (r && $('pass') === p) holoSet(r.url, r); });
  if (!holoInit.rs) { holoInit.rs = 1; addEventListener('resize', holoLayout); }
}
function holoPoke() {
  const H = HOLO; H.e = 1;
  if (!H.raf && $('pass')) { H.last = performance.now(); H.raf = requestAnimationFrame(holoTick); }
}
/* Live 3D dissolve (a behaviour while you interact, not a transition): the figure stays whole and
   sheds miniature chips of its own pixels from its silhouette, mostly on the side the card is
   tilting toward. Chips live in 3D (depth, perspective, spin) and are rotated by the same tilt as the card. */
const VITRINE = true;   // faint glass-box wireframe around the figure; set false to remove
const rot = (x, y, z, ay, ax) => {
  const X = x * Math.cos(ay) + z * Math.sin(ay); let Z = -x * Math.sin(ay) + z * Math.cos(ay);
  const Y = y * Math.cos(ax) - Z * Math.sin(ax); Z = y * Math.sin(ax) + Z * Math.cos(ax);
  return [X, Y, Z];
};
function holoDir() {                                   // where chips should drift: tilt + current movement
  let x = tilt.cx + HOLO.vx * .25, y = tilt.cy + HOLO.vy * .25; const l = Math.hypot(x, y);
  return l < .12 ? [.7, -.35, 0] : [x / l, y / l, Math.min(1, l)];
}
function holoSpawn(n) {
  const H = HOLO; if (!H.pts.length) return;
  const [dx, dy, mag] = holoDir();
  for (let i = 0; i < n && H.pr.length < 1200; i++) {
    let best = null, bs = -9, nx = 0, ny = 0;
    for (let j = 0; j < 3; j++) {                      // best of 3: prefer edge sites facing the drift direction
      const q = H.pts[Math.random() * H.pts.length | 0]; let ox = q[0] - .5, oy = q[1] - .42; const l = Math.hypot(ox, oy) || 1; ox /= l; oy /= l;
      const sc = ox * dx + oy * dy + Math.random() * .8; if (sc > bs) { bs = sc; best = q; nx = ox; ny = oy; }
    }
    let vx = dx + nx * .35 + (Math.random() - .5) * .6, vy = dy + ny * .35 + (Math.random() - .5) * .6; const l = Math.hypot(vx, vy) || 1;
    const sp = (12 + Math.random() * 26) * (1 + 1.8 * mag);
    H.pr.push({ u: best[0] - nx * Math.random() * .05, v: best[1] - ny * Math.random() * .05, vx: vx / l * sp, vy: vy / l * sp,
      z: Math.random() * 2 - 1, vz: (Math.random() - .5) * 26, a: 0, life: .75 + Math.random() * 1.25, sz: .34 + Math.random() ** 2 * 1.05, rs: (Math.random() - .5) * 5, r0: Math.random() * 6.28 });
  }
}
function holoTick(now) {
  const H = HOLO, p = $('pass'); H.raf = 0; if (!p) return;
  if (p.clientWidth !== H.pw) holoLayout();
  const dt = Math.max(.001, Math.min(.05, (now - H.last) / 1000)); H.last = now;
  H.e = Math.max(0, H.e - dt / 1.1);                   // interaction energy: fades ~1s after the last movement
  const tgt = tilt.pointer ? 1 : H.e, rising = tgt > H.L;
  H.L += (tgt - H.L) * (1 - Math.exp(-dt / (rising ? .3 : .7)));
  if (tgt === 0 && H.L < .004) H.L = 0;
  const L = H.L, st = p.style, ho = reduced ? sm(0, .5, L) * .5 : sm(.1, .7, L) * .5;
  H.vx = (tilt.cx - H.pcx) / dt; H.vy = (tilt.cy - H.pcy) / dt; H.pcx = tilt.cx; H.pcy = tilt.cy;
  H.m += (Math.min(1, Math.hypot(H.vx, H.vy) * .9) - H.m) * (1 - Math.exp(-dt / .25));
  st.setProperty('--ho', ho.toFixed(3));               // the figure itself only fades in/out, in place
  st.setProperty('--hb', sm(0, .6, L).toFixed(3)); st.setProperty('--hm', H.m.toFixed(3));
  const c = H.cx, img = H.tex;
  if (!reduced && c) {
    c.clearRect(0, 0, H.pw, H.ph);
    const mag = Math.min(1, Math.hypot(tilt.cx, tilt.cy));
    if (L > .25) { H.acc = (H.acc || 0) + dt * L * (28 + 150 * mag + 150 * H.m); const n = H.acc | 0; H.acc -= n; if (n) holoSpawn(n); }
    if (H.burst) { holoSpawn(H.burst); H.burst = 0; }
    const F = 520, dp = H.dpr || 1, fx = H.bl + H.W / 2 - tilt.cx * 11, fy = H.bt + H.H / 2 - tilt.cy * 8, ay = tilt.cx * .4, ax = -tilt.cy * .3;
    if (VITRINE && ho > .01) {                         // glass box: thin edges that swing with the tilt
      const hw = H.W * .48, hh = H.H * .48, hd = 70, V = [];
      for (let i = 0; i < 8; i++) { const P = rot((i & 1 ? hw : -hw), (i & 2 ? hh : -hh), (i & 4 ? hd : -hd), ay, ax), k = F / (F + P[2]); V.push([fx + P[0] * k, fy + P[1] * k]); }
      c.strokeStyle = 'rgba(215,232,255,' + (.2 * ho).toFixed(3) + ')'; c.lineWidth = .8; c.beginPath();
      [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]].forEach(([a, b]) => { c.moveTo(V[a][0], V[a][1]); c.lineTo(V[b][0], V[b][1]); });
      c.stroke();
    }
    const nw = img && img.naturalWidth, nh = img && img.naturalHeight, fade = sm(0, .25, Math.max(L, .3));
    for (let i = H.pr.length; i--;) {
      const q = H.pr[i]; q.a += dt; const t = q.a / q.life;
      if (t >= 1) { H.pr.splice(i, 1); continue; }
      const P = rot((q.u - .5) * H.W + q.vx * q.a, (q.v - .5) * H.H + q.vy * q.a, q.z * 105 + q.vz * q.a, ay, ax), k = F / (F + P[2]);
      const s = Math.max(.28, q.sz * k * (1 + .38 * q.z) * (1 - .32 * t)), al = Math.min(1, q.a / .12) * (1 - t) ** .8 * (.55 + .45 * (q.z + 1) / 2) * fade;
      const cs = Math.cos(q.r0 + q.rs * q.a), sn = Math.sin(q.r0 + q.rs * q.a);
      c.setTransform(dp * cs, dp * sn, -dp * sn, dp * cs, dp * (fx + P[0] * k), dp * (fy + P[1] * k));
      c.globalAlpha = al * .28; c.fillStyle = '#dbe8ff'; c.fillRect(-s / 2 + s * .18, -s / 2 + s * .18, s * .82, s * .82);      // side face = thickness
      c.globalAlpha = al;
      if (nw) { const cw = Math.max(1, s / H.W * nw * 1.35); c.drawImage(img, q.u * nw - cw / 2, q.v * nh - cw / 2, cw, cw, -s / 2, -s / 2, s, s); }
      else { c.fillStyle = '#dfeaff'; c.fillRect(-s / 2, -s / 2, s, s); }
      if (s > 1.25) { c.globalAlpha = al * .32; c.fillStyle = '#fff'; c.fillRect(-s / 2, -s / 2, s, Math.max(.35, s * .12)); }   // lit top edge
    }

  }

  if (L > 0 || H.e > 0 || H.pr.length) H.raf = requestAnimationFrame(holoTick);
}

/* ---------- credential status ---------- */
function statusOf(r) {
  if ((r.status || '').toLowerCase() === 'revoked') return 'revoked';
  const today = new Date(); today.setHours(0,0,0,0);
  const until = r.validUntil ? new Date(r.validUntil + 'T23:59:59') : null;
  const from = r.validFrom ? new Date(r.validFrom + 'T00:00:00') : null;
  if (until && new Date() > until) return 'expired';
  if (from && new Date() < from) return 'pending';
  return 'active';
}
const fmtDate = v => {
  if (!v) return '';
  const d = /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v + 'T00:00:00') : new Date(v);
  return isNaN(d) ? '' : d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
};
const firstLast = full => {
  const p = String(full || '').trim().split(/\s+/).filter(Boolean);
  if (!p.length) return 'Member';
  return p.length === 1 ? p[0] : p[0] + ' ' + p[p.length - 1];
};
const initials = full => {
  const p = String(full || '').trim().split(/\s+/).filter(Boolean);
  return ((p[0] || '')[0] || 'J') + ((p.length > 1 ? p[p.length - 1][0] : '') || '');
};

/* ---------- rendering ---------- */
const LOGO = `<img class="logo" alt="JourKnows PH" src="/jourknows-logo-transparent-centered.png"
  onerror="if(!this.dataset.t){this.dataset.t=1;this.src='jourknows-logo-transparent-centered.png'}else{this.outerHTML='<span class=&quot;wm&quot;>JOURKNOWS PH</span>'}">`;

const ICONS = {
  active: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  warn:   '<svg viewBox="0 0 24 24"><path d="M12 6v8M12 18v.2"/></svg>',
  bad:    '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const BANNER = {
  active:  { c:'var(--green)', t:'Identity verified',      s:'This Press ID is active and was issued by JourKnows PH.' },
  expired: { c:'var(--amber)', t:'Credential expired',     s:'This card was issued by JourKnows PH but is no longer valid.' },
  pending: { c:'var(--amber)', t:'Not yet valid',          s:'This card was issued by JourKnows PH but its validity period has not started.' },
  revoked: { c:'var(--red)',   t:'Credential revoked',     s:'JourKnows PH has withdrawn this Press ID. Do not accept it.' }
};

function renderFound(r, st) {
  const b = BANNER[st];
  const name = firstLast(r.holderName);
  const photo = r.photo || r.photoUrl || '';
  // Prefer a transparent cutout for the hologram; fall back through to the
  // plain photo so records with only `photo` still get a (non-cutout) hologram.
  const holoSrc = r.photoCutout || r.photoTransparent || r.hologramPhoto || r.photo || r.photoUrl || '';
  const hasCutout = !!(r.photoCutout || r.photoTransparent || r.hologramPhoto);
  const avatarSrc = photo || holoSrc;
  const avatar = avatarSrc ? `
    <img class="avatar-base" src="${esc(avatarSrc)}" alt="${esc(name)}" onerror="this.closest('.avatar').textContent='${esc(initials(r.holderName)).toUpperCase()}'">` : esc(initials(r.holderName)).toUpperCase();
  const now = new Date();
  const when = now.toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' }) + ', ' + now.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
  const rows = [
    ['Press ID No.', r.pressId, true, 'Press ID copied'],
    ['Verification code', r.verifyCode, true, 'Code copied'],
    ['Organization', 'JourKnows PH'],
    ['Valid from', fmtDate(r.validFrom)],
    ['Valid until', fmtDate(r.validUntil)],
    ['Issued on', fmtDate(r.issuedAt)]
  ].filter(x => x[1]);
  const rowsHTML = rows.map(([k, v, cp, msg]) => cp
    ? `<button class="row copy" data-copy="${esc(v)}" data-msg="${esc(msg)}"><span class="k">${k}</span><span class="v mono">${esc(v)}</span></button>`
    : `<div class="row"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join('');

  $('wrap').style.setProperty('--c', b.c);
  $('wrap').innerHTML = `
    ${r._sample ? '<div class="sample rise" style="--i:0">Sample record — not a real credential</div>' : ''}
    <div class="topbar rise" style="--i:0">${LOGO}<span class="live"><i></i>Verified ${esc(when)}</span></div>
    <div class="stage3d rise" style="--i:1">
      <section class="pass${holoSrc ? ' has-holo' : ''}" id="pass">
        <div class="pass-top"><span class="wm" style="font-size:12px;letter-spacing:1.6px">JOURKNOWS PH</span><span class="pill">PRESS IDENTIFICATION</span></div>
        <div class="avatar">${avatar}</div>
        ${holoSrc ? HOLO_HTML : ''}
        <h1 class="p-name">${esc(name)}</h1>
        ${r.position ? `<div class="p-role">${esc(r.position)}</div>` : ''}
        ${r.department ? `<div class="p-desk">${esc(r.department)}</div>` : ''}
        <div class="p-press">PRESS</div>
        <div class="p-foot">JOURNALISM IS FOR ALL</div>
        ${holoSrc ? '<div class="holo-glass" aria-hidden="true"></div>' : ''}
      </section>
    </div>
    <button class="tilt-chip rise" id="tiltChip" type="button" style="--i:1;display:none">Tap to enable motion tilt</button>
    <div class="glass banner rise" style="--i:2">
      <div class="b-ic">${ICONS[st === 'active' ? 'active' : st === 'revoked' ? 'bad' : 'warn']}</div>
      <div><div class="b-t">${b.t}</div><div class="b-s">${b.s}</div></div>
    </div>
    <div class="g-title rise" style="--i:3">Credential details</div>
    <div class="glass group rise" style="--i:3">${rowsHTML}</div>
    <p class="note rise" style="--i:4">Tap the Press ID or code to copy it. If the person in front of you doesn't match the photo on this record, don't accept the card.</p>
    <div class="actions rise" style="--i:5">
      <button class="act" id="again" type="button">Verify another ID</button>
      <button class="act" id="replay" type="button">Replay verification</button>
      <button class="act" id="tiltBtn" type="button" style="display:none">Enable tilt effect</button>
    </div>
    <div class="foot rise" style="--i:6"><b>JOURKNOWS PH</b>Cards remain the property of JourKnows PH and may be invalidated when the holder is no longer authorized to represent the organization.</div>`;

  holoInit(holoSrc, hasCutout);
}

function renderFail(code) {
  $('wrap').style.setProperty('--c', 'var(--red)');
  $('wrap').innerHTML = `
    <div class="topbar rise" style="--i:0">${LOGO}<span></span></div>
    <section class="glass fail-card rise" style="--i:1">
      <div class="b-ic">${ICONS.bad}</div>
      <h1>Couldn't verify this ID</h1>
      <p>${code ? 'No Press ID matches the code <b style="color:#fff;letter-spacing:1.5px">' + esc(code) + '</b>.' : 'No code was provided.'} The card may be counterfeit, mistyped, or no longer issued. Check the code and try again.</p>
    </section>
    <div class="actions rise" style="--i:2">
      <button class="act" id="again" type="button">Try another code</button>
      <button class="act" id="replay" type="button">Scan again</button>
    </div>
    <div class="foot rise" style="--i:3"><b>JOURKNOWS PH</b>Questions about a Press ID? Contact the organization directly through its official channels.</div>`;
}

/* ---------- Face ID timeline ---------- */
function setFidText(title, sub) {
  const t = $('fidText');
  t.classList.add('swap');
  setTimeout(() => {
    $('fidTitle').textContent = title;
    $('fidSub').textContent = sub || '';
    t.classList.remove('swap');
  }, 180);
}

function resetStage() {
  const fid = $('fid');
  fid.className = 'fid';
  fid.style.display = '';
  document.body.classList.remove('revealed');
  $('result').classList.remove('show', 'go');
  $('entry').classList.remove('show');
  $('island').className = 'island';
  $('wrap').innerHTML = '';
  window.scrollTo(0, 0);
}

async function run(code) {
  const token = ++runToken;
  currentCode = code;
  resetStage();
  const fid = $('fid'), isl = $('island');
  $('fidTitle').textContent = 'Press ID';
  $('fidSub').textContent = code === '__SAMPLE__' ? 'Sample record' : 'Code ' + code;

  const lookup = findRecord(code);

  await sleep(450);           if (token !== runToken) return;
  isl.classList.add('on');
  fid.classList.add('in');
  await sleep(750);           if (token !== runToken) return;
  fid.classList.add('draw');
  setFidText('Verifying credential', 'Checking the JourKnows PH registry');
  isl.classList.add('scan');
  $('islText').textContent = 'Verifying';
  await sleep(950);           if (token !== runToken) return;
  fid.classList.add('scan');

  const [rec] = await Promise.all([lookup, sleep(1600)]);
  if (token !== runToken) return;

  let st = null, cls = 'bad';
  if (rec) { st = statusOf(rec); cls = st === 'active' ? 'ok' : st === 'revoked' ? 'bad' : 'warn'; }
  else { fid.classList.add('shake'); buzz([30, 60, 30, 60, 30]); await sleep(700); if (token !== runToken) return; }

  fid.classList.remove('scan', 'shake');
  fid.classList.add(cls);
  isl.classList.add('done');
  isl.style.setProperty('--c', cls === 'ok' ? 'var(--green)' : cls === 'warn' ? 'var(--amber)' : 'var(--red)');
  if (cls === 'ok') {
    setFidText('Verified', firstLast(rec.holderName));
    $('islText').textContent = 'Verified';
    buzz([14, 50, 22]);
  } else if (cls === 'warn') {
    setFidText(st === 'expired' ? 'Expired' : 'Not yet valid', firstLast(rec.holderName));
    $('islText').textContent = st === 'expired' ? 'Expired' : 'Not yet valid';
    buzz([20, 60, 20]);
  } else {
    setFidText(rec ? 'Revoked' : 'Not verified', rec ? firstLast(rec.holderName) : 'No matching credential');
    $('islText').textContent = rec ? 'Revoked' : 'Not verified';
    if (rec) buzz([30, 60, 30, 60, 30]);
  }
  await sleep(1650);          if (token !== runToken) return;

  // reveal
  if (rec) renderFound(rec, st); else renderFail(code);
  const res = $('result');
  res.classList.add('show');
  document.body.classList.add('revealed');
  fid.classList.add('out');
  window.scrollTo(0, 0);
  requestAnimationFrame(() => requestAnimationFrame(() => res.classList.add('go')));
  bindResult();
  setTimeout(() => { if (token === runToken) isl.className = 'island'; }, 1800 * F);
  setTimeout(() => { if (token === runToken) fid.style.display = 'none'; }, 1100);
}

/* ---------- interactions ---------- */
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 1700);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e2) { return false; }
  }
}

/* ---------- tilt engine ----------
   One eased render loop drives the card. It is fed by:
   - mouse hover, or touch-and-drag on the card (every device: the fallback)
   - device orientation (iPhone, Android), calibrated to the way the phone is held */
const TILT_MAX = 8;        // max card rotation, degrees per axis
const MOTION_RANGE = 22;   // phone movement (deg) that gives ~76% of TILT_MAX; tanh() soft-limits beyond it
const MOTION_SIGN = 1;     // 1 = card leans the way the phone leans (as before); -1 = counter-rotates
const RECENTER_MS = 5000;  // how slowly "neutral" drifts to wherever the phone is held

const tilt = { tx: 0, ty: 0, ta: 0, cx: 0, cy: 0, ca: 0, raf: 0, last: 0, pointer: false };
const motion = { listening: false, asking: false, seen: false, on: true, base: null, angle: 0 };
const clamp1 = v => Math.max(-1, Math.min(1, v));
const wrapDeg = d => ((d + 540) % 360) - 180;

function paintTilt() {
  const pass = $('pass');
  if (!pass) return;
  const st = pass.style;
  st.setProperty('--ry', (tilt.cx * TILT_MAX).toFixed(2) + 'deg');
  st.setProperty('--rx', (-tilt.cy * TILT_MAX).toFixed(2) + 'deg');
  st.setProperty('--px', tilt.cx.toFixed(3));
  st.setProperty('--py', tilt.cy.toFixed(3));
  st.setProperty('--mx', (50 + tilt.cx * 50).toFixed(1) + '%');
  st.setProperty('--my', (tilt.ca * (50 + tilt.cy * 50)).toFixed(1) + '%');
}
function stepTilt(now) {
  tilt.raf = 0;
  const dt = Math.max(1, Math.min(64, now - tilt.last));
  tilt.last = now;
  const k = 1 - Math.exp(-dt / (tilt.pointer ? 80 : 120));   // frame-rate independent easing
  tilt.cx += (tilt.tx - tilt.cx) * k;
  tilt.cy += (tilt.ty - tilt.cy) * k;
  tilt.ca += (tilt.ta - tilt.ca) * k;
  paintTilt();
  if (Math.abs(tilt.tx - tilt.cx) + Math.abs(tilt.ty - tilt.cy) + Math.abs(tilt.ta - tilt.ca) > .0008) {
    tilt.raf = requestAnimationFrame(stepTilt);
  }
}
function aimTilt(x, y, active) {
  if (active && (tilt.pointer || Math.abs(x - tilt.tx) + Math.abs(y - tilt.ty) > .012)) holoPoke();   // real movement (mouse, touch, gyro) wakes the hologram
  tilt.tx = clamp1(x); tilt.ty = clamp1(y); tilt.ta = active ? 1 : 0;
  if (!tilt.raf) { tilt.last = performance.now(); tilt.raf = requestAnimationFrame(stepTilt); }
}
function resetTilt() {
  tilt.tx = tilt.ty = tilt.ta = tilt.cx = tilt.cy = tilt.ca = 0;
  tilt.pointer = false;
}

/* ---------- device motion ---------- */
const iosGate = () => !!window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function';
const screenAngle = () => {
  const a = (window.screen && screen.orientation && typeof screen.orientation.angle === 'number')
    ? screen.orientation.angle : (window.orientation || 0);
  return ((a % 360) + 360) % 360;
};
function onOrient(e) {
  if (e.beta == null || e.gamma == null) return;        // desktop browsers fire one empty event
  if (!motion.seen) { motion.seen = true; updateTiltBtn(); }
  if (!motion.on || tilt.pointer || !$('pass')) return;
  const now = performance.now(), ang = screenAngle();
  if (!motion.base || motion.angle !== ang) { motion.base = { b: e.beta, g: e.gamma, t: now }; motion.angle = ang; }
  const B = motion.base;
  const db = wrapDeg(e.beta - B.b), dg = wrapDeg(e.gamma - B.g);
  const k = 1 - Math.exp(-Math.min(100, now - B.t) / RECENTER_MS);
  B.t = now; B.b += db * k; B.g += dg * k;              // neutral slowly follows how the phone is held
  let x, y;                                              // map device axes to screen axes
  switch (ang) {
    case 90:  x = db;  y = -dg; break;
    case 180: x = -dg; y = -db; break;
    case 270: x = -db; y = dg;  break;
    default:  x = dg;  y = db;
  }
  aimTilt(MOTION_SIGN * Math.tanh(x / MOTION_RANGE), MOTION_SIGN * Math.tanh(y / MOTION_RANGE), true);
}
function startGyro() {
  if (motion.listening) return;
  motion.listening = true;
  window.addEventListener('deviceorientation', onOrient);
  document.addEventListener('visibilitychange', () => { motion.base = null; });
}
function bindGyro() {
  // iOS 13+ only delivers events after requestGyro() succeeds, so don't start there.
  if (motion.listening || reduced || !window.DeviceOrientationEvent || iosGate()) return;
  startGyro();
}
function needsGyroPrompt() {
  return !reduced && iosGate() && !motion.listening;
}
function requestGyro(silent) {
  if (reduced || !window.DeviceOrientationEvent || motion.listening || motion.asking) return;
  if (!iosGate()) return bindGyro();
  motion.asking = true;
  // iOS 13+: must be called directly inside a user-gesture handler.
  DeviceOrientationEvent.requestPermission().then(state => {
    if (state === 'granted') { motion.on = true; startGyro(); toast('Tilt enabled'); }
    // iOS returns 'denied' with no popup once denied before; re-enable in Settings > Safari > Motion & Orientation Access.
    else if (!silent) toast('Tilt blocked — enable it in Settings > Safari');
  }).catch(() => {
    if (!silent) toast('Tilt unavailable on this browser');
  }).finally(() => { motion.asking = false; updateTiltBtn(); });
}
function updateTiltBtn() {
  const ask = needsGyroPrompt();
  const btn = $('tiltBtn'), chip = $('tiltChip');
  if (btn) {
    btn.style.display = (ask || motion.seen) ? '' : 'none';
    btn.textContent = ask ? 'Enable tilt effect' : motion.on ? 'Tilt effect: On' : 'Tilt effect: Off';
  }
  if (chip) chip.style.display = ask ? '' : 'none';
}

function bindResult() {
  document.querySelectorAll('.row.copy').forEach(b => b.addEventListener('click', async () => {
    const ok = await copyText(b.dataset.copy);
    buzz(10);
    toast(ok ? b.dataset.msg : 'Copy not available');
  }));
  const again = $('again'), replay = $('replay'), tiltBtn = $('tiltBtn');
  if (again) again.onclick = showEntry;
  if (replay) replay.onclick = () => run(currentCode);
  if (tiltBtn) tiltBtn.onclick = () => {
    if (needsGyroPrompt()) return requestGyro(false);
    motion.on = !motion.on; motion.base = null;         // once enabled the button toggles the effect
    if (!motion.on) aimTilt(0, 0, false);
    toast(motion.on ? 'Tilt enabled' : 'Tilt off');
    updateTiltBtn();
  };
  const tiltChip = $('tiltChip');
  if (tiltChip) tiltChip.onclick = () => requestGyro(false);
  resetTilt();
  updateTiltBtn();

  // pass tilt + light: mouse hover, touch-and-drag, and device motion all feed the same engine
  const pass = $('pass');
  if (pass && !reduced) {
    paintTilt();
    const aim = e => {
      const r = pass.getBoundingClientRect();
      tilt.pointer = true;
      aimTilt(((e.clientX - r.left) / r.width - .5) * 2, ((e.clientY - r.top) / r.height - .5) * 2, true);
    };
    const rest = () => { tilt.pointer = false; aimTilt(0, 0, false); };
    pass.addEventListener('pointerdown', aim);
    pass.addEventListener('pointermove', aim);
    pass.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') rest(); });
    pass.addEventListener('pointerleave', rest);
    pass.addEventListener('pointercancel', rest);
    // tapping the card is a valid gesture for the iOS motion permission prompt
    pass.addEventListener('click', () => { if (needsGyroPrompt()) requestGyro(true); });
    pass.addEventListener('click', () => { HOLO.burst = 28; holoPoke(); });   // tap = small burst of chips
  } else if (pass) ['pointerenter', 'pointerdown', 'click'].forEach(n => pass.addEventListener(n, holoPoke));   // reduced motion: static crossfade only
}

function showEntry() {
  runToken++;
  resetStage();
  $('fid').style.display = 'none';
  $('entry').classList.add('show');
  $('codeIn').value = '';
  setTimeout(() => $('codeIn').focus(), 50);
}
function submitCode() {
  const c = $('codeIn').value.trim().toUpperCase();
  if (!c) { $('codeIn').focus(); return; }
  try { history.replaceState(null, '', '?code=' + encodeURIComponent(c)); } catch (e) {}
  requestGyro();
  run(c);
}
$('codeGo').onclick = submitCode;
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') submitCode(); });
$('sampleGo').onclick = () => { requestGyro(); run('__SAMPLE__'); };

/* ---------- boot ---------- */
(function init() {
  bindGyro(); // no-op on iOS 13+ until requestGyro() runs after a tap
  const u = codeFromURL();
  if (u.sample) return run('__SAMPLE__');
  if (u.code) return run(u.code);
  showEntry();
})();
</script>
</body>
</html>
